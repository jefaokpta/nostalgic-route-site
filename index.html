<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nostalgic Route — banda de rock clássico. Confira agenda, repertório, galeria e entre em contato.">
  <title>Nostalgic Route | Home</title>
  <link rel="icon" href="assets/imgs/caveira.png" type="image/png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page-main">
    <section class="hero">
      <div class="hero__media">
        <video class="hero__video" autoplay muted loop playsinline aria-hidden="true">
          <source src="assets/videos/banda-completa-tocando.mp4" type="video/mp4">
        </video>
        <img class="hero__fallback" src="assets/imgs/banda-completa-tocando.jpg" alt="">
        <div class="hero__overlay"></div>
      </div>
      <div class="hero__content">
        <img class="hero__shield" src="assets/imgs/escudo.png" alt="Escudo Nostalgic Route">
        <h1 class="hero__title">Nostalgic Route</h1>
        <p class="hero__tagline">Rock clássico ao vivo</p>
      </div>
    </section>

    <section class="teaser page-section">
      <div class="container teaser__grid">
        <article class="teaser-card">
          <p class="teaser-card__label">Próximo show</p>
          <h2 class="teaser-card__title">Komb Rock Bar</h2>
          <p class="teaser-card__text">01 de Agosto de 2026 em São Paulo. Uma noite de clássicos do rock que marcaram
            gerações.</p>
          <a href="agenda.html" class="btn btn--accent">Ver agenda</a>
        </article>
        <article class="teaser-card">
          <p class="teaser-card__label">Repertório</p>
          <h2 class="teaser-card__title">30+ clássicos</h2>
          <p class="teaser-card__text">Metallica, Guns N' Roses, Iron Maiden e muito mais. Confira a lista completa.</p>
          <a href="repertorio.html" class="btn btn--accent">Ver repertório</a>
        </article>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
</body>
</html>
