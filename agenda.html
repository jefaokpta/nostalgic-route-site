<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda de shows da Nostalgic Route. Confira datas, locais e compre ingressos.">
  <title>Nostalgic Route | Agenda</title>
  <link rel="icon" href="assets/imgs/caveira.png" type="image/png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page-main">
    <section class="page-section">
      <div class="container">
        <h1 class="page-title">Agenda</h1>
        <p class="page-subtitle">Confira onde a Nostalgic Route vai estar tocando em breve.</p>

        <article class="event-card">
          <div class="event-card__flyer">
            <img src="assets/imgs/banda-completa-tocando.jpg" alt="Flyer — Nostalgic Route no Bar do Rock">
          </div>
          <div class="event-card__body">
            <p class="event-card__date">01 Agosto 2026</p>
            <h2 class="event-card__venue">Komb Rock Bar</h2>
            <p class="event-card__location">Av. Piranguçu, 171, Jardim Imperador, São Paulo, SP</p>
            <p>Uma noite especial com os maiores clássicos do rock. Entrada a partir das 22h. Não perca!</p>
            <a href="#" class="btn btn--accent">Entrada Gratuíta!</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
</body>
</html>
