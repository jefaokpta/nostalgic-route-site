<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre em contato com a Nostalgic Route para contratação de shows e parcerias.">
  <title>Nostalgic Route | Contato</title>
  <link rel="icon" href="assets/imgs/caveira.png" type="image/png">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page-main">
    <section class="page-section">
      <div class="container">
        <h1 class="page-title">Contato</h1>
        <p class="page-subtitle">Quer contratar a Nostalgic Route para o seu evento? Entre em contato conosco.</p>

        <div class="contact-grid">
          <div class="contact-item">
            <p class="contact-item__label">E-mail</p>
            <p class="contact-item__value">
              <a href="mailto:nostalgicroute@gmail.com">nostalgicroute@gmail.com</a>
            </p>
          </div>

          <div class="contact-item">
            <p class="contact-item__label">Contratação</p>
            <p class="contact-item__value">Shows, festas, eventos corporativos e festivais. Respondemos em até 48 horas.</p>
          </div>

          <div class="contact-item">
            <p class="contact-item__label">Redes sociais</p>
            <div class="contact-social">
              <a href="https://www.instagram.com/nostalgicrouteband/" aria-label="Instagram" target="_blank"
                 rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm10 2H7a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3zm-5 3.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm5.75-2.25a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/></svg>
              </a>
              <a href="https://www.youtube.com/@NostalgicRoute" aria-label="YouTube" target="_blank"
                 rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 7.2a3 3 0 0 0-2.1-2.1C17.8 4.6 12 4.6 12 4.6s-5.8 0-7.5.5A3 3 0 0 0 2.4 7.2 31.4 31.4 0 0 0 2 12a31.4 31.4 0 0 0 .4 4.8 3 3 0 0 0 2.1 2.1c1.7.5 7.5.5 7.5.5s5.8 0 7.5-.5a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 22 12a31.4 31.4 0 0 0-.4-4.8zM10 15.5v-7l6 3.5-6 3.5z"/></svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/layout.js"></script>
</body>
</html>
